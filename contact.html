<body>
    <div id="global-nav"></div>
    <script src="nav.js"></script>

    <header class="page-hero wrap">
        <p class="eyebrow">Contact</p>
        <h1>Contact</h1>
        <p>Call, email, or send the project details. We reply within one business day.</p>
    </header>

    <main id="inquiry-form" class="section" style="padding-top:1.2rem">
        <div class="wrap split">
            <div class="info-stack">
                <a class="card" href="tel:+16266394749">
                    <h3>(626) 639-4749</h3>
                    <p>Mon–Sat, 8:00 AM – 5:00 PM</p>
                </a>
                <a class="card" href="mailto:info@ram-contractor.com">
                    <h3>info@ram-contractor.com</h3>
                    <p>Project questions and plans welcome.</p>
                </a>
                <div class="card">
                    <h3>San Gabriel Valley</h3>
                    <p>Pasadena, San Marino, Altadena, East Pasadena, and South Pasadena.</p>
                </div>
            </div>

            <form class="form-panel" action="https://formsubmit.co/workorders@hpo.center" method="POST">
                <input type="hidden" name="_subject" value="New project inquiry — RAM Construction">
                <input type="text" name="_honey" style="display:none">
                <input type="hidden" name="_next" value="https://ram-contractor.com/thanks.html">
                <div class="form-grid">
                    <div class="field">
                        <label for="firstName">First name</label>
                        <input id="firstName" name="First Name" required autocomplete="given-name">
                    </div>
                    <div class="field">
                        <label for="lastName">Last name</label>
                        <input id="lastName" name="Last Name" required autocomplete="family-name">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="Email" type="email" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" name="Phone" type="tel" required autocomplete="tel">
                    </div>
                    <div class="field full">
                        <label for="service">Service</label>
                        <select id="service" name="Service Needed">
                            <option>General construction inquiry</option>
                            <option>Luxury kitchen remodeling</option>
                            <option>Bathroom renovation</option>
                            <option>Historic restoration</option>
                            <option>ADU or room addition</option>
                            <option>Structural or foundation repair</option>
                            <option>Outdoor living</option>
                        </select>
                    </div>
                    <div class="field full">
                        <label for="message">Project details and location</label>
                        <textarea id="message" name="Message" rows="6" required placeholder="Neighborhood, what you want built, and when you hope to start."></textarea>
                    </div>
                    <div class="field full">
                        <button class="btn btn-gold" type="submit" style="width:100%">Send inquiry</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
